[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitsci"
version = "0.1.0"
description = "Git for Science: проверки научных проектов лаборатории (LaTeX, библиография, авторы, план, графики, эксперименты)"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "requests>=2.28",
    "numpy>=1.24",
    "pillow>=9",
]

[project.optional-dependencies]
mpl = ["matplotlib>=3.7"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
gitsci = "gitsci.cli:main"

[tool.setuptools.packages.find]
include = ["gitsci*"]

[tool.setuptools.package-data]
gitsci = ["profiles/*.yml", "data/*.txt", "data/*.yml", "data/*.mplstyle"]

[tool.ruff]
line-length = 110
